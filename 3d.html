
<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Empire 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#87b9d5;font-family:Arial}
canvas{display:block;width:100%;height:100dvh}
#info{position:fixed;top:12px;left:12px;z-index:2;
background:#102331;color:white;padding:12px;border-radius:12px}
</style>
<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>
</head>
<body>
<div id="info">🏰 EMPIRE 3D<br>دوربین را با انگشت بچرخان</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c5e5);
scene.fog=new THREE.Fog(0x91c5e5,45,110);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,200);
camera.position.set(17,15,20);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.target.set(0,0,0);
controls.maxPolarAngle=1.48;
controls.minDistance=9;
controls.maxDistance=45;

scene.add(new THREE.HemisphereLight(0xffffff,0x526b37,2));

const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(15,25,10);
sun.castShadow=true;
scene.add(sun);

function box(x,y,z,w,h,d,color){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color,roughness:.9})
 );
 m.position.set(x,y+h/2,z);
 m.castShadow=true;
 m.receiveShadow=true;
 scene.add(m);
 return m;
}

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(100,100),
 new THREE.MeshStandardMaterial({color:0x477b37})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// قلعه
box(0,0,0,10,1,9,0x77736a);
box(0,1,0,7,5,6,0xb1a28a);

for(const x of [-4,4]){
 for(const z of [-3.5,3.5]){
  box(x,1,z,2,7,2,0x93816c);
  box(x,8,z,2.4,.8,2.4,0x51483e);
 }
}

box(0,1,-3.1,2,3,.5,0x493322);

// درخت‌ها
for(let i=0;i<40;i++){
 const x=(Math.random()-.5)*65;
 const z=(Math.random()-.5)*65;
 if(Math.abs(x)<9&&Math.abs(z)<9)continue;
 box(x,0,z,.5,2,.5,0x68462a);
 const tree=new THREE.Mesh(
  new THREE.ConeGeometry(1.5,4,7),
  new THREE.MeshStandardMaterial({color:0x245b29})
 );
 tree.position.set(x,3,z);
 scene.add(tree);
}

function animate(){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
