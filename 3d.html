
<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EMPIRE 3D WAR</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#17251c;font-family:Arial;color:white}
#game{position:fixed;inset:0}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-around;gap:5px;flex-wrap:wrap;pointer-events:none}
.stat{background:#17251ddd;padding:8px 11px;border:1px solid #a98b4d;border-radius:9px;font-size:13px}
#menu{position:fixed;bottom:8px;left:7px;right:7px;display:flex;gap:6px;overflow-x:auto;padding:7px;background:#17251eea;border:1px solid #927744;border-radius:12px}
button{background:#76532b;color:white;border:1px solid #d3ae67;border-radius:9px;padding:10px 12px;min-width:85px;font-size:13px;font-weight:bold}
button:active{background:#b17c35}
#message{position:fixed;top:65px;left:50%;transform:translateX(-50%);background:#142019e8;padding:9px 14px;border-radius:9px;font-size:13px;text-align:center;max-width:90%}
#help{position:fixed;bottom:85px;left:8px;background:#17251ddd;padding:8px;border-radius:8px;font-size:12px}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div class="stat">🪙 طلا: <span id="gold">500</span></div>
 <div class="stat">🪵 چوب: <span id="wood">300</span></div>
 <div class="stat">⚔️ ارتش: <span id="army">5</span></div>
</div>
<div id="message">به امپراتوری خوش آمدی!</div>
<div id="help">برای چرخاندن نقشه انگشت بکش؛ برای ساخت، ساختمان را انتخاب کن و زمین را لمس کن.</div>
<div id="menu">
 <button onclick="choose('barracks')">⚔️ سربازخانه<br>۱۰۰ طلا</button>
 <button onclick="choose('tower')">🗼 برج دفاعی<br>۸۰ طلا</button>
 <button onclick="choose('farm')">🌾 مزرعه<br>۵۰ چوب</button>
 <button onclick="choose('mine')">⛏️ معدن<br>۱۰۰ چوب</button>
 <button onclick="choose('house')">🏠 خانه<br>۶۰ چوب</button>
 <button onclick="choose('cancel')">❌ لغو ساخت</button>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bc5d3);
scene.fog=new THREE.Fog(0x9bc5d3,35,90);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,150);
camera.position.set(19,22,25);
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.target.set(0,0,0);
controls.maxPolarAngle=Math.PI/2.05;
controls.minDistance=9;
controls.maxDistance=48;

scene.add(new THREE.HemisphereLight(0xffffff,0x52633b,2));
const sun=new THREE.DirectionalLight(0xffedc7,2.2);
sun.position.set(-15,25,10);
sun.castShadow=true;
scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(65,65),new THREE.MeshStandardMaterial({color:0x568344}));
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

function box(x,y,z,w,h,d,color){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color}));
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function tree(x,z){
 const trunk=box(x,.65,z,.35,1.3,.35,0x684126);
 const top=new THREE.Mesh(new THREE.ConeGeometry(1.1,2.7,7),new THREE.MeshStandardMaterial({color:0x245d2d}));
 top.position.set(x,2.4,z);top.castShadow=true;scene.add(top);
}
function castle(){
 box(0,1.5,0,8,3,7,0xb5a17c);
 box(0,3.3,0,4,1,4,0x9a896c);
 for(const x of [-3.5,3.5])for(const z of [-3,3]){
  box(x,2.4,z,1.5,4.8,1.5,0x88775e);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(1.2,1.5,4),new THREE.MeshStandardMaterial({color:0x863c2d}));
  roof.position.set(x,5.4,z);roof.castShadow=true;scene.add(roof);
 }
 box(0,1,-3.56,1.5,2,0.2,0x54351e);
}
castle();

const road=box(0,.04,12,3,.08,30,0xbba477);
const river=box(-15,.06,0,3,.12,55,0x318eb2);
box(-15,.15,0,4,.15,55,0x287a9a);

for(let i=0;i<55;i++){
 let x=(Math.random()-.5)*58,z=(Math.random()-.5)*58;
 if(Math.abs(x)<7&&Math.abs(z)<8)continue;
 if(Math.abs(x+15)<3)continue;
 tree(x,z);
}
for(let i=0;i<5;i++){
 box(-5+i*2,.5,9,0.7,1,.7,0x315dba);
}
for(let i=0;i<6;i++){
 box(12+i%3,0.6,-10+Math.floor(i/3)*2,.7,1.2,.7,0xa63232);
}

let gold=500,wood=300,army=5,pending=null;
const costs={
 barracks:{gold:100,wood:0},
 tower:{gold:80,wood:0},
 farm:{gold:0,wood:50},
 mine:{gold:0,wood:100},
 house:{gold:0,wood:60}
};
const names={barracks:'سربازخانه',tower:'برج دفاعی',farm:'مزرعه',mine:'معدن',house:'خانه'};
function msg(t){document.getElementById('message').textContent=t}
function update(){
 document.getElementById('gold').textContent=gold;
 document.getElementById('wood').textContent=wood;
 document.getElementById('army').textContent=army;
}
window.choose=function(type){
 if(type==='cancel'){pending=null;msg('ساخت لغو شد');return}
 pending=type;msg('جای '+names[type]+' را روی زمین لمس کن');
};
function building(type,x,z){
 if(type==='tower'){
  box(x,1.4,z,1.5,2.8,1.5,0x927b60);
  box(x,3,z,1.9,.5,1.9,0x6f3d2e);
 }else if(type==='barracks'){
  box(x,1,z,4,2,3,0x99744a);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(2.7,1.5,4),new THREE.MeshStandardMaterial({color:0x853e30}));
  roof.position.set(x,2.7,z);roof.rotation.y=Math.PI/4;scene.add(roof);
 }else if(type==='farm'){
  box(x,.15,z,4,.3,4,0x9b8a42);
  for(let i=0;i<4;i++)box(x-1.3+i*.8,.35,z,.12,.4,3,0x3d702b);
 }else if(type==='mine'){
  box(x,.5,z,3,1,3,0x777777);
  box(x,1.2,z,1.8,.5,1.8,0x444444);
 }else{
  box(x,.9,z,2.5,1.8,2.5,0xb99a70);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(2,1.3,4),new THREE.MeshStandardMaterial({color:0x8e4935}));
  roof.position.set(x,2.2,z);roof.rotation.y=Math.PI/4;scene.add(roof);
 }
}
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{
 if(!pending)return;
 const dx=e.clientX,dy=e.clientY;
 const type=pending,cost=costs[type];
 if(gold<cost.gold||wood<cost.wood){msg('منابع کافی نداری!');pending=null;return}
 pointer.x=dx/innerWidth*2-1;
 pointer.y=-(dy/innerHeight)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObject(ground);
 if(!hits.length)return;
 const p=hits[0].point;
 if(Math.abs(p.x)<5&&Math.abs(p.z)<5){msg('نزدیک قلعه جا نیست؛ جای دیگری را انتخاب کن');return}
 if(Math.abs(p.x+15)<3){msg('روی رودخانه نمی‌توان ساخت');return}
 if(Math.abs(p.x)>27||Math.abs(p.z)>27){msg('بیرون از محدوده نقشه است');return}
 gold-=cost.gold;wood-=cost.wood;
 building(type,p.x,p.z);
 if(type==='barracks')army+=3;
 update();pending=null;msg(names[type]+' ساخته شد! 🎉');
});
let last=0;
function animate(t){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
update();
</script>
</body>
</html>
