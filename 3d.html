
<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EMPIRE 3D WAR</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#253b29;font-family:Arial;color:white}
#game{position:fixed;inset:0}
#hud{position:fixed;top:8px;left:6px;right:6px;display:flex;justify-content:space-around;gap:5px}
.stat{background:#18251eea;padding:9px;border:1px solid #c6a45e;border-radius:9px;font-size:13px}
#menu{position:fixed;bottom:7px;left:6px;right:6px;display:flex;gap:6px;overflow-x:auto;background:#18251eed;padding:7px;border:1px solid #b49353;border-radius:12px}
button{background:#79552e;color:white;border:1px solid #d6b56f;border-radius:8px;padding:10px;min-width:85px;font-size:12px;font-weight:bold}
#message{position:fixed;top:57px;left:50%;transform:translateX(-50%);background:#18251eea;padding:9px;border-radius:9px;font-size:12px;text-align:center;white-space:nowrap}
#help{position:fixed;bottom:83px;left:7px;background:#18251edb;padding:7px;border-radius:8px;font-size:11px}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
<div class="stat">🪙 <span id="gold">500</span></div>
<div class="stat">🪵 <span id="wood">300</span></div>
<div class="stat">⚔️ <span id="army">5</span></div>
</div>
<div id="message">EMPIRE 3D – امپراتوری تو</div>
<div id="help">ساخت‌وساز: ساختمان را انتخاب کن و روی زمین بزن</div>
<div id="menu">
<button onclick="choose('barracks')">⚔️ سربازخانه<br>۱۰۰ طلا</button>
<button onclick="choose('tower')">🗼 برج<br>۸۰ طلا</button>
<button onclick="choose('farm')">🌾 مزرعه<br>۵۰ چوب</button>
<button onclick="choose('mine')">⛏️ معدن<br>۱۰۰ چوب</button>
<button onclick="choose('house')">🏠 خانه<br>۶۰ چوب</button>
<button onclick="moveArmy()">🚩 حرکت ارتش</button>
<button onclick="choose('cancel')">❌ لغو</button>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bc5dc);
scene.fog=new THREE.Fog(0x9bc5dc,45,100);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,150);
camera.position.set(20,23,27);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('game').appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.target.set(0,0,0);
controls.maxPolarAngle=Math.PI/2.05;
controls.minDistance=10;
controls.maxDistance=48;

scene.add(new THREE.HemisphereLight(0xffffff,0x52613a,2));
const sun=new THREE.DirectionalLight(0xffe7bd,2.4);
sun.position.set(-15,28,12);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const mat=(color,roughness=.9)=>new THREE.MeshStandardMaterial({color,roughness});
const green=mat(0x628b43), stone=mat(0xb5a68a), darkStone=mat(0x746b5b);
const brown=mat(0x76502e), roofMat=mat(0x803f32);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(70,70),green);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

function box(parent,x,y,z,w,h,d,material){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);
 m.castShadow=true;m.receiveShadow=true;
 parent.add(m);return m;
}
function sphere(parent,x,y,z,r,material){
 const m=new THREE.Mesh(new THREE.SphereGeometry(r,12,10),material);
 m.position.set(x,y,z);m.castShadow=true;
 parent.add(m);return m;
}
function cone(parent,x,y,z,r,h,material){
 const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,8),material);
 m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m;
}

// رودخانه و جاده
box(scene,-15,.04,0,3,.12,65,mat(0x287fa8,.3));
box(scene,0,.06,12,3,.12,32,mat(0xb6a17a));
box(scene,-15,.16,0,4,.12,65,mat(0x378fb4,.3));

// پل
box(scene,-12.5,.35,7,2,.5,5,mat(0x8d7654));
for(let i=0;i<5;i++)box(scene,-12.5,.65,5+i*.9,2,.12,.12,stone);

// قلعه
const castle=new THREE.Group();scene.add(castle);
box(castle,0,1.5,0,8,3,7,stone);
box(castle,0,3.25,0,4,1,4,darkStone);
box(castle,0,1,-3.56,1.5,2,.18,brown);
for(const x of [-3.5,3.5])for(const z of [-3,3]){
 box(castle,x,2.3,z,1.5,4.6,1.5,darkStone);
 box(castle,x,4.7,z,1.8,.5,1.8,stone);
 cone(castle,x,5.7,z,1.15,1.5,roofMat);
}
box(castle,0,3.9,0,2,.25,2,mat(0xd2bd91));

// درخت‌ها
function tree(x,z){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 box(g,0,.8,0,.35,1.6,.35,brown);
 cone(g,0,2,0,1.1,2.5,mat(0x285d2b));
 cone(g,0,2.8,0,.8,2,mat(0x347239));
}
for(let i=0;i<65;i++){
 const x=(Math.random()-.5)*62,z=(Math.random()-.5)*62;
 if(Math.abs(x)<7&&Math.abs(z)<8)continue;
 if(Math.abs(x+15)<3)continue;
 tree(x,z);
}

// سرباز آدم‌مانند با اندام متحرک
const soldiers=[];
function soldier(x,z,color){
 const g=new THREE.Group();
 g.position.set(x,0,z);
 scene.add(g);
 const uniform=mat(color), skin=mat(0xd6a477), metal=mat(0x9da7a9,.5);
 const boot=mat(0x392b23), helmet=mat(color===0x315dbb?0x263d65:0x7d3028);
 // بدن
 const torso=box(g,0,1.35,0,.65,.85,.38,uniform);
 // کمربند
 box(g,0,1.05,0,.68,.12,.4,brown);
 // گردن و سر
 box(g,0,1.9,0,.2,.2,.2,skin);
 sphere(g,0,2.2,0,.29,skin);
 // کلاه
 sphere(g,0,2.42,0,.31,helmet);
 box(g,0,2.35,.24,.55,.09,.22,helmet);
 // چشم‌ها
 sphere(g,-.1,2.21,.255,.035,mat(0x171717));
 sphere(g,.1,2.21,.255,.035,mat(0x171717));
 // دست‌ها با محور چرخش
 const arms=[];
 for(const side of [-1,1]){
  const pivot=new THREE.Group();
  pivot.position.set(side*.42,1.7,0);
  g.add(pivot);
  const arm=box(pivot,0,-.3,0,.2,.65,.22,uniform);
  sphere(pivot,0,-.68,.02,.12,skin);
  arms.push(pivot);
 }
 // پاها با محور چرخش
 const legs=[];
 for(const side of [-1,1]){
  const pivot=new THREE.Group();
  pivot.position.set(side*.19,.95,0);
  g.add(pivot);
  box(pivot,0,-.3,0,.24,.65,.27,uniform);
  box(pivot,0,-.65,.09,.27,.16,.4,boot);
  legs.push(pivot);
 }
 // شمشیر
 const sword=box(g,.52,1.3,.12,.09,.8,.09,metal);
 sword.rotation.z=-.2;
 soldiers.push({g,arms,legs,phase:Math.random()*6,speed:0,target:null});
 return g;
}

// ارتش آبی
for(let i=0;i<5;i++)soldier(-3+i*1.3,8+(i%2),0x315dbb);
// دشمن قرمز
for(let i=0;i<6;i++)soldier(10+(i%3)*1.4,-10+Math.floor(i/3)*2,0xa63232);

// اردوگاه دشمن
box(scene,13,.6,-13,5,1.2,4,mat(0x745238));
for(let i=0;i<3;i++){
 const tent=cone(scene,11+i*2,2,-13,1.3,2.3,mat(0x9b4937));
 tent.rotation.z=Math.PI;
}

// سنگ‌های تزئینی
for(let i=0;i<25;i++){
 const x=(Math.random()-.5)*55,z=(Math.random()-.5)*55;
 if(Math.abs(x)<8&&Math.abs(z)<8)continue;
 sphere(scene,x,.25,z,.3+Math.random()*.3,mat(0x77786b));
}

let gold=500,wood=300,army=5,pending=null;
const costs={
 barracks:{gold:100,wood:0},
 tower:{gold:80,wood:0},
 farm:{gold:0,wood:50},
 mine:{gold:0,wood:100},
 house:{gold:0,wood:60}
};
const names={barracks:'سربازخانه',tower:'برج دفاعی',farm:'مزرعه',mine:'معدن',house:'خانه'};
function message(t){document.getElementById('message').textContent=t}
function update(){
 document.getElementById('gold').textContent=gold;
 document.getElementById('wood').textContent=wood;
 document.getElementById('army').textContent=army;
}
window.choose=function(type){
 if(type==='cancel'){pending=null;message('ساخت لغو شد');return}
 pending=type;message('جای '+names[type]+' را روی زمین انتخاب کن');
};

function build(type,x,z){
 if(type==='tower'){
  box(scene,x,1.4,z,1.5,2.8,1.5,darkStone);
  box(scene,x,3,z,1.9,.5,1.9,roofMat);
  box(scene,x,3.5,z,1.2,.5,1.2,stone);
 }else if(type==='barracks'){
  box(scene,x,1,z,4,2,3,brown);
  const r=cone(scene,x,2.7,z,2.7,1.5,roofMat);
  r.rotation.y=Math.PI/4;
 }else if(type==='farm'){
  box(scene,x,.15,z,4,.3,4,mat(0xa58b48));
  for(let i=0;i<4;i++)box(scene,x-1.3+i*.8,.35,z,.12,.4,3,mat(0x36702b));
 }else if(type==='mine'){
  box(scene,x,.5,z,3,1,3,darkStone);
  box(scene,x,1.2,z,1.8,.5,1.8,mat(0x454545));
 }else{
  box(scene,x,.9,z,2.5,1.8,2.5,stone);
  const r=cone(scene,x,2.2,z,2,1.3,roofMat);
  r.rotation.y=Math.PI/4;
 }
}

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{
 if(!pending)return;
 pointer.x=e.clientX/innerWidth*2-1;
 pointer.y=-(e.clientY/innerHeight)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObject(ground);
 if(!hits.length)return;
 const p=hits[0].point;
 if(Math.abs(p.x)<5&&Math.abs(p.z)<5){message('اینجا قلعه است؛ جای دیگری را انتخاب کن');return}
 if(Math.abs(p.x+15)<3){message('روی رودخانه نمی‌توان ساخت');return}
 if(Math.abs(p.x)>28||Math.abs(p.z)>28){message('بیرون از نقشه است');return}
 const c=costs[pending];
 if(gold<c.gold||wood<c.wood){message('منابع کافی نداری!');pending=null;return}
 gold-=c.gold;wood-=c.wood;
 build(pending,p.x,p.z);
 if(pending==='barracks'){
  soldier(p.x+2,p.z+2,0x315dbb);
  soldier(p.x-2,p.z+2,0x315dbb);
  army+=2;
 }
 update();message(names[pending]+' ساخته شد!');pending=null;
});

let moving=false;
window.moveArmy=function(){
 moving=!moving;
 for(let i=0;i<5;i++){
  const s=soldiers[i];
  s.target=moving?new THREE.Vector3(7+i*.7,0,12):null;
 }
 message(moving?'ارتش به حرکت درآمد!':'فرمان حرکت لغو شد');
};

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime();
 for(const s of soldiers){
  const walking=s.target!==null;
  if(walking){
   const dx=s.target.x-s.g.position.x;
   const dz=s.target.z-s.g.position.z;
   const d=Math.sqrt(dx*dx+dz*dz);
   if(d>.25){
    s.g.position.x+=dx/d*.035;
    s.g.position.z+=dz/d*.035;
    s.g.rotation.y=Math.atan2(dx,dz);
   }else{s.target=null}
  }
  const active=walking&&s.target!==null;
  const swing=active?Math.sin(t*9+s.phase)*.65:Math.sin(t*2+s.phase)*.04;
  s.legs[0].rotation.x=swing;
  s.legs[1].rotation.x=-swing;
  s.arms[0].rotation.x=-swing*.7;
  s.arms[1].rotation.x=swing*.7;
 }
 controls.update();
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
update();
</script>
</body>
</html>
