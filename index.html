
<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>امپراتوری</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Tahoma;overflow:hidden}
header{height:55px;background:#172b35;display:flex;align-items:center;justify-content:space-around;font-size:13px}
#game{display:block;width:100%;height:calc(100dvh - 145px);background:#527d48;touch-action:none}
footer{height:90px;background:#172b35;display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap;padding:8px}
button{background:#bd8a35;color:white;border:1px solid #f3cb72;border-radius:9px;padding:12px 10px;font-weight:bold}
button:active{background:#e6ad49}
#msg{text-align:center;font-size:12px;color:#ffe5a0;padding:4px}
</style>
</head>
<body>
<header>
<span>🪙 <b id="gold">500</b></span>
<span>🪵 <b id="wood">300</b></span>
<span>🍖 <b id="food">300</b></span>
<span>⚔️ <b id="army">5</b></span>
</header>
<canvas id="game"></canvas>
<div id="msg">امپراتوری خودت را گسترش بده!</div>
<footer>
<button onclick="train()">⚔️ ساخت سرباز</button>
<button onclick="build()">🏰 ساخت برج</button>
<button onclick="collect()">📦 جمع‌آوری منابع</button>
<button onclick="moveHome()">🏠 قلعه من</button>
</footer>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
let W=1800,H=1300,camX=0,camY=0,scale=1;
let gold=500,wood=300,food=300,army=5;
let units=[],trees=[],buildings=[],particles=[];
let enemy={x:1450,y:650,hp:100};
let dragging=false,lastX=0,lastY=0;
function resize(){
let d=devicePixelRatio||1;
c.width=c.clientWidth*d;c.height=c.clientHeight*d;
ctx.setTransform(d,0,0,d,0,0);
}
window.addEventListener("resize",resize);resize();
for(let i=0;i<100;i++){
trees.push({x:80+Math.random()*1640,y:80+Math.random()*1140});
}
for(let i=0;i<5;i++)units.push({x:370+i*35,y:680,team:0,phase:Math.random()*6});
function castle(x,y,color,name){
ctx.fillStyle="#26302b";ctx.fillRect(x-48,y-24,96,60);
ctx.fillStyle=color;ctx.fillRect(x-40,y-58,80,75);
ctx.fillStyle="#d5bd91";ctx.fillRect(x-10,y+5,20,42);
ctx.fillStyle=color;
for(let i=-35;i<=35;i+=35)ctx.fillRect(x+i-9,y-75,18,25);
ctx.fillStyle="white";ctx.font="bold 16px Tahoma";
ctx.textAlign="center";ctx.fillText(name,x,y-88);
}
function drawTree(t){
ctx.fillStyle="rgba(0,0,0,.2)";ctx.beginPath();ctx.ellipse(t.x+5,t.y+9,19,8,0,0,7);ctx.fill();
ctx.fillStyle="#68472b";ctx.fillRect(t.x-4,t.y,8,20);
ctx.fillStyle="#1b5736";ctx.beginPath();ctx.arc(t.x,t.y-5,19,0,7);ctx.fill();
ctx.fillStyle="#347b43";ctx.beginPath();ctx.arc(t.x-7,t.y-12,11,0,7);ctx.fill();
}
function draw(){
let cw=c.clientWidth,ch=c.clientHeight;
ctx.clearRect(0,0,cw,ch);
ctx.save();ctx.translate(-camX,-camY);
ctx.fillStyle="#63894a";ctx.fillRect(0,0,W,H);
// زمین و جزئیات
for(let i=0;i<120;i++){
let x=(i*173)%W,y=(i*293)%H;
ctx.fillStyle=i%2?"rgba(30,80,40,.10)":"rgba(230,210,120,.08)";
ctx.beginPath();ctx.arc(x,y,18,0,7);ctx.fill();
}
// رودخانه
ctx.fillStyle="#397f9d";ctx.beginPath();
ctx.moveTo(0,270);ctx.quadraticCurveTo(550,400,850,280);
ctx.quadraticCurveTo(1200,180,1800,350);
ctx.lineTo(1800,430);ctx.quadraticCurveTo(1200,260,850,370);
ctx.quadraticCurveTo(500,490,0,350);ctx.fill();
ctx.strokeStyle="#82c5d0";ctx.lineWidth=5;ctx.stroke();
// جاده
ctx.strokeStyle="#b9a078";ctx.lineWidth=35;ctx.beginPath();
ctx.moveTo(380,680);ctx.quadraticCurveTo(850,580,1450,650);ctx.stroke();
ctx.strokeStyle="#d9c49b";ctx.lineWidth=3;ctx.stroke();
// جنگل
trees.forEach(drawTree);
// سنگ‌ها
for(let i=0;i<35;i++){
let x=(i*211+120)%W,y=(i*137+500)%H;
ctx.fillStyle="#777d70";ctx.beginPath();ctx.ellipse(x,y,12,8,.3,0,7);ctx.fill();
}
// قلعه ها
castle(350,650,"#357ac0","امپراتوری تو");
castle(enemy.x,enemy.y,"#b44939","دشمن");
// ساختمان‌های بازیکن
buildings.forEach(b=>{
ctx.fillStyle="#d8a64b";ctx.fillRect(b.x-17,b.y-20,34,35);
ctx.fillStyle="#75432a";ctx.beginPath();ctx.moveTo(b.x-23,b.y-20);ctx.lineTo(b.x,b.y-42);ctx.lineTo(b.x+23,b.y-20);ctx.fill();
});
// سربازها
units.forEach(u=>{
u.phase+=.04;
let bob=Math.sin(u.phase)*3;
ctx.fillStyle="rgba(0,0,0,.2)";ctx.beginPath();ctx.ellipse(u.x,u.y+8,10,5,0,0,7);ctx.fill();
ctx.fillStyle="#263c69";ctx.beginPath();ctx.arc(u.x,u.y-8+bob,8,0,7);ctx.fill();
ctx.fillStyle="#e5c18c";ctx.fillRect(u.x-5,u.y-19+bob,10,10);
ctx.strokeStyle="#ddd";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(u.x+8,u.y-13+bob);ctx.lineTo(u.x+15,u.y-27+bob);ctx.stroke();
});
// افکت‌ها
particles=particles.filter(p=>p.life-->0);
particles.forEach(p=>{ctx.fillStyle="#ffd36a";ctx.globalAlpha=p.life/20;ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();});
ctx.globalAlpha=1;
ctx.restore();
requestAnimationFrame(draw);
}
function update(){
document.getElementById("gold").textContent=gold;
document.getElementById("wood").textContent=wood;
document.getElementById("food").textContent=food;
document.getElementById("army").textContent=army;
}
function message(t){document.getElementById("msg").textContent=t;}
function train(){
if(gold>=100&&food>=50){
gold-=100;food-=50;army++;
units.push({x:390+Math.random()*50,y:680+Math.random()*50,team:0,phase:Math.random()*6});
message("یک سرباز جدید به ارتش تو پیوست!");
}else message("برای ساخت سرباز طلا و غذا کافی نیست!");
update();
}
function build(){
if(wood>=100&&gold>=80){
wood-=100;gold-=80;
buildings.push({x:430+Math.random()*100,y:740+Math.random()*80});
message("ساختمان جدید ساخته شد!");
}else message("چوب یا طلا کافی نیست!");
update();
}
function collect(){
gold+=80;wood+=60;food+=50;
message("منابع امپراتوری افزایش یافت!");
update();
}
function moveHome(){camX=170;camY=420;message("به قلعه خودت برگشتی!");}
function screenPoint(e){
let r=c.getBoundingClientRect();
return {x:e.clientX-r.left,y:e.clientY-r.top};
}
c.addEventListener("pointerdown",e=>{
dragging=true;let p=screenPoint(e);lastX=p.x;lastY=p.y;
c.setPointerCapture(e.pointerId);
});
c.addEventListener("pointermove",e=>{
if(!dragging)return;
let p=screenPoint(e);
camX=Math.max(0,Math.min(W-c.clientWidth,camX-(p.x-lastX)));
camY=Math.max(0,Math.min(H-c.clientHeight,camY-(p.y-lastY)));
lastX=p.x;lastY=p.y;
});
c.addEventListener("pointerup",()=>dragging=false);
setInterval(()=>{
if(Math.random()<.7){gold+=5;food+=3;update();}
},4000);
update();draw();
</script>
</body>
</html>
